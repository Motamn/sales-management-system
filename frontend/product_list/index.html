<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 m-0 custom-scroll">

  <nav class="nav-bar h-24 flex items-center justify-between bg-white shadow-md px-6 z-20 sticky top-0">
    <i class="fa-solid fa-sun cursor-pointer text-xl"></i>
    <i id="toggle" class="fa-solid fa-list List text-xl cursor-pointer"></i>
  </nav>

  <div id="sidebar-container" class="fixed top-24 left-0 h-[calc(100vh-6rem)] w-52 bg-gray-800 text-white p-4 overflow-y-auto z-10 custom-scroll transition-transform duration-300 transform translate-x-0">
    <ul class="sidebr-list flex flex-col gap-2">
      <li class="nav-item">
        <a href="#"><span>Dashboard</span><i class="fa-solid fa-border-all"></i></a>
      </li>
      <li class="nav-item">
        <a href="#"><span>Create Product</span><i class="fa-solid fa-box-open"></i></a>
      </li>
      <li class="nav-item">
        <a href="#"><span>Product List</span><i class="fa-solid fa-bars-staggered"></i></a>
      </li>
      <li class="nav-item">
        <a href="#"><span>Profile</span><i class="fa-solid fa-user"></i></a>
      </li>
      <li class="nav-item">
        <a href="#"><span>Logout</span><i class="fa-solid fa-right-to-bracket"></i></a>
      </li>
    </ul>
  </div>

  <div id="product-page" class="ml-52 transition-all duration-300">
    <div class="max-w-7xl mx-auto p-6">
    
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold text-gray-800">Products List</h2>
            </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4">
                <div class="flex items-center gap-2">


                    <button id="filter-button" class="flex items-center gap-1 px-4 py-2 border rounded-md text-sm text-gray-700 hover:bg-gray-200 active:scale-90 transform-stroke duration-300">
                        <i class="fa-solid fa-filter"></i>
                        Filter
                    </button>


                    <div class="relative">
                        <input type="text" placeholder="Search On This Table" class="pl-10 pr-4 py-2 border rounded-md text-sm w-full md:w-80 focus:outline-none focus:ring-gray-800 focus:border-gray-800">
                        <i class="fa-solid fa-search text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button class="bg-green-500 text-white px-4 py-2 rounded-md text-sm active:scale-90 transform-stroke duration-300">Excel</button>
                    <button class="bg-red-500 text-white px-4 py-2 rounded-md text-sm active:scale-90 transform-stroke duration-300">PDF</button>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm active:scale-90 transform-stroke duration-300">Import</button>
                </div>
            </div>

            <div class="overflow-x-auto custom-scroll">
                <table class="w-full min-w-[1000px] text-sm text-right">

                    <thead class="bg-gray-50">
                        <tr> 
                            <th class="px-8 py-4 font-medium text-gray-600 uppercase">Image</th>
                            <th class="px-8 py-4 font-medium text-gray-600 uppercase">Name</th>
                            <th class="px-8 py-4 font-medium text-gray-600 uppercase">Code</th>
                            <th class="px-8 py-4 font-medium text-gray-600 uppercase">Category</th>
                            <th class="px-8 py-4 font-medium text-gray-600 uppercase">Price</th>
                            <th class="px-8 py-4 font-medium text-gray-600 uppercase">Unit</th>
                            <th class="px-8 py-4 font-medium text-gray-600 uppercase">Quantity</th>
                            <th class="px-8 py-4 font-medium text-gray-600 uppercase">Action</th>
                        </tr>

                    </thead>
                    
                    <!-- body of row -->
                    <tbody id="product-table-body" class="divide-y divide-gray-200">

                        <!-- first row -->
                        <tr>
                            <td class="px-6 py-4">
                                <img class="w-10 h-10 rounded-md object-cover" src="https://via.placeholder.com/40" alt="Product Image">
                            </td>

                            <td class="px-6 py-4 font-medium text-gray-900">Earphones</td>
                            <td class="px-6 py-4 text-gray-700">5389607</td>
                            <td class="px-6 py-4 text-gray-700">Electronics</td>
                            <td class="px-6 py-4 text-gray-700">101.00</td>
                            <td class="px-6 py-4 text-gray-700">pc</td>
                            <td class="px-6 py-4 text-gray-700">105</td>
                            <td class="px-6 py-4">
                                <div class="flex gap-3 text-lg">
                                    <a href="#" class="text-blue-500 hover:text-blue-700"><i class="fa-solid fa-pen"></i></a>
                                    <a href="#" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></a>
                                    <a href="#" class="text-green-500 hover:text-green-700"><i class="fa-solid fa-eye"></i></a>
                                </div>
                            </td>
                        </tr>

                        <!-- second row -->
                        <tr>
                            <td class="px-6 py-4">
                                <img class="w-10 h-10 rounded-md object-cover" src="https://via.placeholder.com/40" alt="Product Image">
                            </td>
                            <td class="px-6 py-4 font-medium text-gray-900">Smart Watch</td>
                            <td class="px-6 py-4 text-gray-700">5389601</td>
                            <td class="px-6 py-4 text-gray-700">Electronics</td>
                            <td class="px-6 py-4 text-gray-700">212.00</td>
                            <td class="px-6 py-4 text-gray-700">pc</td>
                            <td class="px-6 py-4 text-gray-700">111</td>
                            <td class="px-6 py-4">
                                <div class="flex gap-3 text-lg">
                                    <a href="#" class="text-blue-500 hover:text-blue-700"><i class="fa-solid fa-pen"></i></a>
                                    <a href="#" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></a>
                                    <a href="#" class="text-green-500 hover:text-green-700"><i class="fa-solid fa-eye"></i></a>
                                </div>
                            </td>
                        </tr>

                        </tbody>
                </table>
            </div>

            <!-- <div class="flex justify-between items-center pt-4">
                <div class="text-sm text-gray-600">
                    Showing product per page
                    <select class="border rounded-md p-1 focus:outline-none">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <div class="flex items-center gap-1">
                    <button class="px-3 py-1 border rounded-md text-gray-500 hover:bg-gray-100"><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="px-3 py-1 rounded-md text-white bg-indigo-600">1</button>
                    <button class="px-3 py-1 rounded-md text-gray-700 hover:bg-gray-100">2</button>
                    <button class="px-3 py-1 rounded-md text-gray-700 hover:bg-gray-100">3</button>
                    <button class="px-3 py-1 border rounded-md text-gray-500 hover:bg-gray-100"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div> -->

        </div> 
    </div>
  </div>


  <div id="filter-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40"></div>
    <div id="filter-modal" class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl bg-white rounded-lg shadow-xl z-50">
    
    <div class="flex justify-between items-center p-5 border-b">
        <h3 class="text-xl font-bold text-gray-800">Filtering</h3>
        <button id="close-modal-button" class="text-gray-500 hover:text-gray-800">
            <i class="fa-solid fa-xmark text-2xl active:scale-75 duration-200"></i>
        </button>
    </div>
    
    <div class="p-6">
        <form>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="filter_name" class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                    <input type="text" id="filter_name" class="w-full px-3 py-2.5 border border-gray-200 bg-gray-50 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800" placeholder="Enter Product Name">
                </div>
                <div>
                    <label for="filter_category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select id="filter_category" class="w-full px-3 py-2.5 border border-gray-200 bg-gray-50 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800">
                        
                        <option value="">Thermal Mugs</option>
                        <option value="">Travel Cups</option>
                        <option value="">Paper Cups</option>
                        <option value="">Customized Cups</option>
                    </select>
                </div>
                <div>
                    <label for="filter_code" class="block text-sm font-medium text-gray-700 mb-1">Product Code</label>
                    <input type="text" id="filter_code" class="w-full px-3 py-2.5 border border-gray-200 bg-gray-50 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800" placeholder="Enter Product Code">
                </div>
                <!-- <div>
                    <label for="filter_brand" class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
                    <select id="filter_brand" class="w-full px-3 py-2.5 border border-gray-200 bg-gray-50 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800">
                        <option>Choose Brand</option>
                    </select>
                </div> -->
                <div>
                    <label for="filter_price" class="block text-sm font-medium text-gray-700 mb-1">Price</label>
                    <input type="text" id="filter_price" class="w-full px-3 py-2.5 border border-gray-200 bg-gray-50 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800" placeholder="Enter Price">
                </div>
                <div>
                    <label for="filter_availability" class="block text-sm font-medium text-gray-700 mb-1">Select Availability</label>
                    <select id="filter_availability" class="w-full px-3 py-2.5 border border-gray-200 bg-gray-50 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800">
                        <option>In stock</option>
                        <option>Out of stock</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
    
    <div class="grid grid-cols-2 gap-4 p-6 border-t bg-gray-50 rounded-b-lg">
        <button id="cancel-modal-button" class="px-6 py-3 bg-white border border-red-500 text-red-500 rounded-md hover:bg-red-50 font-semibold active:scale-95 transform-stroke duration-200">
            Cancel
        </button>
        <button class="px-6 py-3 border border-gray-700 rounded-md font-semibold hover:bg-gray-200 text-gray-700 active:scale-95 transform-stroke duration-200">
            Filter
        </button>
    </div>
</div>

  


  <script src="main.js"></script>
</body>
</html>
