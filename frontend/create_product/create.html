 <h2 class="text-3xl font-bold text-gray-800 mb-6 dark:text-gray-100">Create Products</h2>

    <form action="#" method="POST">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 transition-all duration-300">

                    </div>

                    <div>

                        <select id="category" name="category"

                            <option value="">Choose Category</option>
                            <option value="">Thermal Mugs</option>

                            <option value="">Paper Cups</option>
                            <option value="">Customized Cups</option>
