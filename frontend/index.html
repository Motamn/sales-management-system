<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Products</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-gray-100 m-0">
  <nav class="nav-bar h-24 flex items-center justify-between">
    <i class="fa-solid fa-gear settings"></i>
    <i class="fa-solid fa-list List"></i>
  </nav>
    <div class="max-w-7xl mx-auto p-6">
        
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Create Products</h2>

        <form action="#" method="POST">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        
                        <div>
                            <label for="product_name" class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                            <input type="text" id="product_name" name="product_name"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                   placeholder="Enter Product Name">
                        </div>

                        <div>
                            <label for="product_code" class="block text-sm font-medium text-gray-700 mb-1">Code Product</label>
                            <input type="text" id="product_code" name="product_code"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                   placeholder="Scan Code">
                        </div>

                        <div>
                            <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <select id="category" name="category"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                <option value="">Choose Category</option>
                                </select>
                        </div>

                        <div>
                            <label for="brand" class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
                            <select id="brand" name="brand"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                <option value="">Choose Brand</option>
                                </select>
                        </div>

                        <div>
                            <label for="barcode" class="block text-sm font-medium text-gray-700 mb-1">Barcode Symbology</label>
                            <select id="barcode" name="barcode"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                <option value="">Choose Symbology</option>
                                </select>
                        </div>

                        <div>
                            <label for="product_cost" class="block text-sm font-medium text-gray-700 mb-1">Product Cost</label>
                            <input type="text" id="product_cost" name="product_cost"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                   placeholder="Enter Product Cost">
                        </div>

                        <div>
                            <label for="product_price" class="block text-sm font-medium text-gray-700 mb-1">Product Price</label>
                            <input type="text" id="product_price" name="product_price"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                   placeholder="Enter Product Price">
                        </div>

                        <div>
                            <label for="product_unit" class="block text-sm font-medium text-gray-700 mb-1">Product Unit</label>
                            <select id="product_unit" name="product_unit"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                <option value="">Choose Product unit</option>
                                </select>
                        </div>

                        <div>
                            <label for="sales_unit" class="block text-sm font-medium text-gray-700 mb-1">Sales Unit</label>
                            <select id="sales_unit" name="sales_unit"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                <option value="">Choose Sales unit</option>
                                </select>
                        </div>

                        <div>
                            <label for="purchase_unit" class="block text-sm font-medium text-gray-700 mb-1">Purchase Unit</label>
                            <select id="purchase_unit" name="purchase_unit"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                <option value="">Choose Purchase unit</option>
                                </select>
                        </div>

                        <div>
                            <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">Product Quantity</label>
                            <input type="number" id="quantity" name="quantity" value="1"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                   placeholder="01">
                        </div>

                        <div>
                            <label for="stock_alert" class="block text-sm font-medium text-gray-700 mb-1">Stock Alert</label>
                            <input type="number" id="stock_alert" name="stock_alert" value="0"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                   placeholder="0">
                        </div>

                        <div>
                            <label for="order_tax" class="block text-sm font-medium text-gray-700 mb-1">Order Tax</label>
                            <div class="relative">
                                <input type="number" id="order_tax" name="order_tax" value="0"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                       placeholder="0">
                                <span class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500">%</span>
                            </div>
                        </div>

                        <div>
                            <label for="tax_type" class="block text-sm font-medium text-gray-700 mb-1">Tax Type</label>
                            <select id="tax_type" name="tax_type"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                <option value="inclusive">Inclusive</option>
                                <option value="exclusive">Exclusive</option>
                            </select>
                        </div>

                        <div class="md:col-span-2">
                            <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                            <textarea id="notes" name="notes" rows="4"
                                      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
                                      placeholder="Add a note"></textarea>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md h-fit">
                    
                    <h3 class="text-lg font-medium text-gray-800 mb-4">Add Multiple Images</h3>
                    
                    <div class="flex items-center justify-center w-full">
                        <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-10 h-10 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-4-4V7a4 4 0 014-4h.586a1 1 0 01.707.293l.414.414a1 1 0 00.707.293h7.172a1 1 0 00.707-.293l.414-.414a1 1 0 01.707-.293H20a4 4 0 014 4v5a4 4 0 01-4 4H7z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Drag & Drop</span> Multiple Images here or</p>
                                <p class="text-xs text-blue-600 font-semibold">Select</p>
                            </div>
                            <input id="dropzone-file" type="file" class="hidden" multiple />
                        </label>
                    </div>

                    <div class="flex items-center mt-6">
                        <input id="multi-variants" name="multi-variants" type="checkbox"
                               class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="multi-variants" class="ml-2 block text-sm text-gray-900">Product Has Multi Variants</label>
                    </div>

                </div>

            </div>

            <div class="mt-6">
                <button type="submit"
                        class="sumb-btn px-6 py-3 text-white font-semibold rounded-md shadow-sm">
                    Submit Products
                </button>
            </div>

        </form>
    </div>

</body>
</html>
