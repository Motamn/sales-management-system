  <div id="edit-page" class="ml-52 transition-all duration-300">
    <div class="max-w-7xl mx-auto p-6">
 <h2 class="text-3xl font-bold text-gray-800 mb-6">Edit Products</h2>

    <form action="#" method="POST">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 transition-all duration-300">

            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    
                    <div>
                        <label for="product_name" class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                        <input type="text" id="product_name" name="product_name"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800"
                               placeholder="Enter Product Name">
                    </div>

                    <div>
                        <label for="product_code" class="block text-sm font-medium text-gray-700 mb-1">Code Product</label>
                        <input type="text" id="product_code" name="product_code"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800"
                               placeholder="Scan Code">
                    </div>

                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                        <select id="category" name="category"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800 bg-white">
                            <option value="">Choose Category</option>
                            <option value="">Thermal Mugs</option>
                            <option value="">Travel Cups</option>
                            <option value="">Paper Cups</option>
                            <option value="">Customized Cups</option>
                            
                        </select>
                    </div>

                    <!-- <div>
                        <label for="brand" class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
                        <select id="brand" name="brand"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800 bg-white">
                            <option value="">Choose Brand</option>
                        </select>
                    </div> -->

                    <!-- <div>
                        <label for="barcode" class="block text-sm font-medium text-gray-700 mb-1">Barcode Symbology</label>
                        <select id="barcode" name="barcode"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800 bg-white">
                            <option value="">Choose Symbology</option>
                        </select>
                    </div> -->

                    <div>
                        <label for="product_cost" class="block text-sm font-medium text-gray-700 mb-1">Product Cost</label>
                        <input type="text" id="product_cost" name="product_cost"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800"
                               placeholder="Enter Product Cost">
                    </div>

                    <div>
                        <label for="product_price" class="block text-sm font-medium text-gray-700 mb-1">Product Price</label>
                        <input type="text" id="product_price" name="product_price"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800"
                               placeholder="Enter Product Price">
                    </div>

                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800 bg-white">

                        </select>

                    <!-- <div>
                        <label for="sales_unit" class="block text-sm font-medium text-gray-700 mb-1">Sales Unit</label>
                        <select id="sales_unit" name="sales_unit"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800 bg-white">

                        </select>
                    </div> -->

                    <div>
                        <label for="purchase_unit" class="block text-sm font-medium text-gray-700 mb-1">Purchase Unit</label>
                        <select id="purchase_unit" name="purchase_unit"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800 bg-white">
                            <option value="">Choose Purchase unit</option>
                            <option value="">Piece</option>
                            <option value="">Packet</option>
                            <option value="">Carton</option>
                            <option value="">Set</option>
                        </select>
                    </div>

                    <div>
                        <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">Product Quantity</label>
                        <input type="number" id="quantity" name="quantity" value="0"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800"

                            <option value="exclusive">Exclusive</option>
                        </select>
                    </div> -->

                    <div class="md:col-span-2">
                        <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                        <textarea id="notes" name="notes" rows="4"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-gray-800 focus:border-gray-800"
                                  placeholder="Add a note"></textarea>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md h-fit">
                
                <h3 class="text-lg font-medium text-gray-800 mb-4">Add Multiple Images</h3>
                
                <div class="flex items-center justify-center w-full">
                    <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">

                    <label for="multi-variants" class="ml-2 block text-sm text-gray-900">Product Has Multi Variants</label>
                </div>

        <div class="mt-6">
            <button type="submit"
                    class="sumb-btn px-6 py-3 text-white font-semibold rounded-md shadow-sm hover:scale-95 transform-stroke duration-100">
